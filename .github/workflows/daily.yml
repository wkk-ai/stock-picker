name: Daily data + site

on:
  schedule:
    # 22:37 UTC = 19:37 in Sao Paulo, after B3 close, Mon-Fri
    - cron: "37 22 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Fetch, score, save
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.run
      - name: Keep raw data for debugging
        uses: actions/upload-artifact@v4
        with:
          name: data
          path: site/data
          retention-days: 7
      - name: Save data snapshot to the data branch (for local development)
        continue-on-error: true
        run: |
          tmp="$RUNNER_TEMP/snap"; mkdir -p "$tmp"; cp -r site/data/. "$tmp/"
          cd "$tmp"; git init -q -b data
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A; git commit -q -m "Data snapshot $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
