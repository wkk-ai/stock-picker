name: Weekly fundamentals history

on:
  schedule:
    # Sundays 09:13 UTC
    - cron: "13 9 * * 0"
  push:
    branches: [main]
    paths: ["pipeline/history.py", ".github/workflows/history.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Build multi-year fundamentals (CVM + SEC)
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python -m pipeline.history
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/data/fundamentals.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update multi-year fundamentals (CVM + SEC)"
          git pull --rebase origin main
          git push origin HEAD:main
